name: tests

permissions:
  contents: read

# Third-party actions are pinned to a commit SHA, not a tag. `@v6` is a moving
# tag: whoever controls that repository can point it at new code, which then
# runs here — and `publish` runs with `packages: write`. That has happened in
# the wild. The trailing comment is the release each SHA belongs to; to update
# one, resolve the tag yourself rather than trusting the comment:
#
#   gh api repos/docker/build-push-action/commits/v6 --jq .sha

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes an in-flight run for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: addon

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the Python version the image ships
        id: python
        # The Dockerfile's FROM is the only Python pin, and Renovate bumps it,
        # so the suite runs on exactly what users get and never on a version
        # nothing ships.
        run: |
          version=$(sed -nE 's/^FROM python:([0-9.]+)-.*/\1/p' Dockerfile | sort -u)
          if [ "$(printf '%s\n' "$version" | grep -c .)" != 1 ]; then
            echo "::error::addon/Dockerfile must have exactly one python:X.Y version, found: ${version:-none}"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.python.outputs.version }}
          cache: pip
          # setup-python resolves this from the repo root, not from
          # defaults.run.working-directory.
          cache-dependency-path: |
            addon/requirements.txt
            addon/pyproject.toml
      - name: Install dependencies
        # requirements.txt is what the Docker image installs and pyproject.toml
        # is what a pip install resolves — install both so the two cannot drift
        # apart unnoticed. The dev extra brings pytest + pytest-asyncio.
        run: pip install -r requirements.txt -e ".[dev]"
      - name: Import every module
        # The suite never imports some runtime-only modules (mqtt/broker.py is
        # one), so an ImportError there would otherwise reach a device instead
        # of failing CI.
        run: |
          python -c "
          import importlib, pkgutil, petkit_local
          for mod in pkgutil.walk_packages(petkit_local.__path__, 'petkit_local.'):
              importlib.import_module(mod.name)
          "
      - name: Run test suite
        run: pytest -q

  # The image has to BUILD on every architecture config.yaml advertises.
  # Nothing else catches this: the Python suite above passes happily while the
  # image is unbuildable, e.g. when a dependency stops publishing a wheel for
  # one arch.
  #
  # Pull requests only: on main the same builds run in `publish.yml`, and a
  # failure there fails the push just as loudly.
  build:
    if: github.event_name == 'pull_request'
    # Each platform builds on its own native runner, so nothing is emulated.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # TARGETARCH is a BuildKit built-in and the legacy builder leaves it
      # empty, so the per-arch go2rtc download needs buildx to work at all.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the add-on image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./addon
          platforms: ${{ matrix.platform }}
          push: false

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the Python version the image ships
        id: python
        run: |
          version=$(sed -nE 's/^FROM python:([0-9.]+)-.*/\1/p' Dockerfile | sort -u)
          if [ "$(printf '%s\n' "$version" | grep -c .)" != 1 ]; then
            echo "::error::addon/Dockerfile must have exactly one python:X.Y version, found: ${version:-none}"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.python.outputs.version }}
      # Narrow on purpose (see [tool.ruff.lint] in pyproject.toml): a gate
      # against real defects, not a style enforcer. Four unused imports reached
      # main before this existed, because the only check anyone ran locally was
      # a pyflakes that turned out not to be installed.
      - name: Lint
        run: |
          pip install ruff
          ruff check petkit_local/ tests/
      # The panel's CSS/JS are prettier-formatted, and until now the only thing
      # enforcing that was a line in CLAUDE.md asking people to run it by hand.
      # No package.json needed — npx matches how it is run locally.
      - name: Check panel formatting
        run: npx prettier@3 --check petkit_local/web/static/js/*.js petkit_local/web/static/styles.css
