name: publish

# Home Assistant's Supervisor pulls `image:` from config.yaml at the add-on's
# own version, so a tag named after a version is a PROMISE that that version is
# released. Pushes to main therefore publish only `dev`, which always points at
# the last commit; the version and `latest` are cut by a `v*` git tag and
# nothing else. Without that split,
# working on main would overwrite the released version's image with unreleased
# code, and every user updating would get it.
#
# ONE image, multi-arch. That is what the add-on documentation asks for --
# `{arch}` in the image name is described there as a compatibility fallback --
# and it is also what docker-compose needs, since Compose has no `{arch}`
# substitution. So the three architectures build in parallel, are pushed into
# the same package BY DIGEST (no tag, so the jobs cannot race for one), and a
# manifest list is assembled from them afterwards.
# Third-party actions are pinned to a commit SHA, not a tag. `@v6` is a moving
# tag: whoever controls that repository can point it at new code, which then
# runs here — and `publish` runs with `packages: write`. That has happened in
# the wild. The trailing comment is the release each SHA belongs to; to update
# one, resolve the tag yourself rather than trusting the comment:
#
#   gh api repos/docker/build-push-action/commits/v6 --jq .sha

on:
  push:
    branches: [main]
    tags: ["v*"]

# The built-in GITHUB_TOKEN can push to ghcr.io/<owner>/* once it is allowed to.
# No PAT and no repository secret is involved.
permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64, linux/arm/v7]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Emulation for the two ARM targets, and buildx because TARGETARCH is a
      # BuildKit built-in that the legacy builder leaves empty -- the per-arch
      # base selection in the Dockerfile does not work without it.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A registry path must be lowercase; a GitHub owner need not be.
      - name: Registry path
        id: image
        run: echo "ref=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./addon
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ steps.image.outputs.ref }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      # An empty file named after the digest: the merge job only needs the
      # names, and this is the shape `download-artifact` reassembles cleanly.
      - name: Hand the digest to the merge job
        run: |
          set -eu
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Assemble the manifest and name it
        run: |
          set -eu
          image="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            # Refuse a tag that disagrees with config.yaml rather than
            # publishing an image the Supervisor will never ask for: it pulls
            # by the version in that file and nothing else.
            declared=$(sed -n 's/^version: *"\(.*\)"$/\1/p' addon/config.yaml)
            version="${GITHUB_REF_NAME#v}"
            if [ "$declared" != "$version" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match config.yaml version $declared"
              exit 1
            fi
            primary="$version"
            tags="-t ${image}:${version} -t ${image}:latest"
          else
            # Just the one moving tag. A per-commit tag would be a second name
            # for something the digest already identifies permanently, and it
            # would leave a tagged version behind on every push -- which GitHub
            # then shows as the package's headline, offering a `docker pull` of
            # an unreleased build to anyone who lands on the page.
            # `org.opencontainers.image.revision` on the image itself is what
            # maps a build back to its commit.
            primary="dev"
            tags="-t ${image}:dev"
          fi

          sources=""
          for d in /tmp/digests/*; do
            sources="$sources ${image}@sha256:$(basename "$d")"
          done

          # shellcheck disable=SC2086
          docker buildx imagetools create $tags $sources
          docker buildx imagetools inspect "${image}:${primary}"
